<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crep Culture - My Account</title>
    <!-- Link to CSS file  -->
    <link rel="stylesheet" href="https://dev-pr7-cs2tp.hotten.cloud/css/styles.css">
    <link rel="stylesheet" href="https://dev-pr7-cs2tp.hotten.cloud/css/useraccount.css">
</head>
<body>
    <header>
        <div class="logo">
            <!-- Website logo -->
            <img src="https://dev-pr7-cs2tp.hotten.cloud/img/logo.png" alt="Crep Culture Logo">
        </div>
        <nav>
            <!-- Navigation links -->
            <a href="/">Home</a>
            <a href="/#shop">Shop</a>
            <a href="/about">About Us</a>
            <a href="/contact">Contact</a>
            <div class="auth-buttons">
                <!-- Account and logout buttons -->
                <a href="/account" class="auth-btn active">My Account</a>
                <a href="/logout" class="auth-btn">Logout</a>
            </div>
        </nav>
        <!-- Shopping cart icon -->
        <div class="basket">
            <a href="/cart">
                <img src="https://dev-pr7-cs2tp.hotten.cloud/img/cart.png" alt="Basket">
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Main account section -->
    <section class="hero">
        <div class="hero-content">
            <h2>My Account</h2>
            <p>Welcome back! View your order history and manage your account details.</p>
        </div>
    </section>
    
    <!-- Account details form -->
    <section class="account-details">
        <h2>Update Account Details</h2>
        <form class="update-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">New Password:</label>
            <input type="password" id="password" name="password">
            
            <button type="submit" class="update-btn">Update Details</button>
        </form>
    </section>

    <!-- Order history section -->
    <section class="featured-products">
        <h2>Order History</h2>
        <div class="products">
            <!-- Table displaying order details -->
            <table>
                <thead>
                    <tr>
                        <th>Order Number</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Insert data for orders below? -->
                    <tr>
                     
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2024 Crep Culture | <a href="#privacy">Privacy Policy</a> | <a href="#terms">Terms of Service</a></p>
    </footer>
</body>
</html>
