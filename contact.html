<!DOCTYPE html> <!-- HTML for making pages-->
<html lang="en"><!-- English as the language -->
<head>
    <meta charset="UTF-8"> <!-- Selecting characterset-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Crep Culture</title><!--Title for the page-->
    <link rel="stylesheet" href="styles.css"> <!-- Link to style sheet for UI-->
</head>
<body>
    <!-- Header Section -->
    <header>
        <img src="logo.png" alt="Crep Culture Logo"><!--Logo for the site-->
        <nav>
            <!--All navigation buttons to move between pages-->
            <a href="index.html">Home</a> <!--Link index page with home button-->
            <a href="index.html#shop">Shop</a> <!-- Shop section currently assigned to the shop section, will be changed when the shop page is implemented-->
            <a href="about.html">About Us</a><!--Link about page with about us button-->
            <a href="contact.html">Contact</a><!--Link contact page with the contact button-->
            <div class="auth-buttons"><!--Login and sign-up buttons which will inherit the CSS style-->
                <a href="login.html" class="auth-btn login-btn cta">Login</a>
                <a href="signup.html" class="auth-btn signup-btn cta">Sign Up</a>
            </div>
        </nav>
        <!--Class for the basket logo which will by styled and displayed on the home page-->
        <div class="basket">
            <a href="cart.html"> <!--Linking to the basket page-->
                <img src="cart.png" alt="Basket" /> <!--The basket logo-->
                <span class="cart-count">0</span> <!--Displays number of items in the basket -->
            </a>
        </div>
    </header>
    
    
        <!--Section for the contact form-->
    <section class="contact">
        <div class="contact-content"><!-- Assigns id to use for when styling-->
            <h2>Contact Us</h2><!--Heading-->
            <p>If you have any questions, comments, or just want to say hi, feel free to reach out to us. We'd love to hear from you!</p><!--Sentence for customers asking them to leave us a message-->
            <form action="#" method="post" class="contact-form"><!--Assigns id and submits data via post method-->
                <label for="name">Name:</label> <!-- Gets name from user-->
                <input type="text" id="name" name="name" required><!-- Ensures something is entered-->

                <label for="email">Email:</label> <!-- Gets email from the user-->
                <input type="email" id="email" name="email" required><!--Esnures something is entered-->

                <label for="message">Message:</label> <!-- Gets the message from the user-->
                <textarea id="message" name="message" rows="5" required></textarea><!--Ensures something is enetered-->

                <button type="submit" class="submit-btn">Send Message</button> <!-- Send message button which is styled using the id-->
            </form><!-- End of form-->
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Crep Culture | <a href="index.html#privacy">Privacy Policy</a> | <a href="index.html#terms">Terms of Service</a></p> <!-- Footer at the bottom of the page-->
    </footer>
</body>
</html>
