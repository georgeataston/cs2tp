<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crep Culture - Checkout</title>
    <link rel="stylesheet" href="https://dev-pr7-cs2tp.hotten.cloud/css/styles.css">
    <link rel="stylesheet" href="https://dev-pr7-cs2tp.hotten.cloud/css/checkout.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://dev-pr7-cs2tp.hotten.cloud/img/logo.png" alt="Crep Culture Logo">
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/#shop">Shop</a>
            <a href="/about">About Us</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Checkout</h2>
            <p>Complete your purchase</p>
        </div>
    </section>

    <section class="checkout-content">
        <div class="basket-summary">
            <h3>Basket Summary</h3>
            <ul>
                <!-- Insert basket summary here-->>
            </ul>
            <p class="total">Total: <span>Filler</span></p>
        </div>

        <div class="checkout-form">
            <h3>Shipping Address</h3>
            <form>
                <input type="text" placeholder="Full Name" required>
                <input type="text" placeholder="Address Line 1" required>
                <input type="text" placeholder="Address Line 2">
                <input type="text" placeholder="City" required>
                <input type="text" placeholder="Postcode" required>

                <h3>Card Details</h3>
                <input type="text" placeholder="Card Number" required>
                <input type="text" placeholder="Cardholder Name" required>
                <div class="card-details">
                    <input type="text" placeholder="Expiry Date" required>
                    <input type="text" placeholder="CVV" required>
                </div>

                <button type="submit" class="checkout-btn">Complete Purchase</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Crep Culture | <a href="#privacy">Privacy Policy</a> | <a href="#terms">Terms of Service</a></p>
    </footer>
</body>
</html>
